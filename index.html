<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f653d"><title>行军边境</title><link rel="stylesheet" href="style.css"></head>
<body><main id="game" aria-label="行军边境即时带队游戏"><div id="world-underlay" class="world-underlay" aria-hidden="true"></div>
  <header class="battle-header" aria-label="摧毁敌方主塔获胜"><i class="hud-skin" data-skin="hud-top" aria-hidden="true"></i><div id="own-castle" class="castle-status"><i class="castle-banner"></i><i class="castle-portrait"></i><div><b id="own-hp">600</b><div class="health-track"><i id="own-hp-bar"></i></div></div></div><div id="battle-goal" class="battle-goal" aria-label="进攻敌方主塔"></div><div id="enemy-castle" class="castle-status enemy"><div><b id="enemy-hp"></b><div class="health-track"><i id="enemy-hp-bar"></i></div></div><i class="castle-portrait"></i><i class="castle-banner"></i></div></header>
  <section class="utility-bar"><div class="resources" aria-label="资源，点击查看来源和费用"><button data-resource="food" aria-label="查看粮食来源和消耗"><i class="resource-icon"></i><b id="food-value">12</b><span class="income-dots"></span></button><button data-resource="wood" aria-label="查看木材来源和消耗"><i class="resource-icon"></i><b id="wood-value">8</b><span class="income-dots"></span></button><button data-resource="ore" aria-label="查看矿石来源和消耗"><i class="resource-icon"></i><b id="ore-value">8</b><span class="income-dots"></span></button></div><span id="clock" aria-label="对局时间">00:00</span><button id="pause" class="icon-button" aria-label="暂停游戏"></button></section>
  <section id="map-wrap" aria-label="十五圈战场"><canvas id="map" role="img" aria-label="三列五行战场，点击相邻圆圈立即行军，按住可连续划线"></canvas><div id="node-controls" aria-label="走向相邻圆圈"></div><button id="help" class="corner-help" aria-label="查看图解帮助"></button></section>
  <section id="command-panel" aria-label="当前编队与沿途效果"><i class="hud-skin" data-skin="hud-bottom" aria-hidden="true"></i><div id="hero-status" class="hero-status"><i class="portrait-frame"></i><i id="hero-portrait"></i><i class="hero-health-ring"></i><div class="hero-meter"><div class="health-track"><i id="hero-hp-bar"></i></div><b id="hero-hp"></b></div><span id="hero-cooldown"></span></div><div class="squad-main"><div class="squad-line"><div id="army-roster" class="army-roster" aria-label="真实兵种和数量"></div><div id="command-pips" class="command-pips" aria-label="指挥容量"></div></div><div id="terrain-effects" class="terrain-effects" aria-label="当前地形效果"></div></div><div id="station-output" class="station-output" role="status" aria-live="polite"></div></section>
</main>
<dialog id="start-dialog" aria-label="选择阵营"><div class="dialog-emblem" data-icon="swords"></div><div id="faction-options" class="faction-options"></div><button id="start-game" class="primary large-play" aria-label="领军出征" data-icon="play"></button></dialog>
<dialog id="help-dialog" aria-label="图解玩法帮助"><div class="dialog-heading"><i data-icon="book"></i><button id="close-help" class="icon-button" aria-label="关闭帮助" data-icon="close"></button></div><div id="help-grid" class="help-grid"></div><div class="menu-actions"><button id="done-help" class="primary" aria-label="继续带队" data-icon="play"></button><button id="restart" aria-label="重新选择阵营" data-icon="return"></button></div></dialog>
<dialog id="ledger-dialog" aria-label="资源来源、库存和自动费用"><div class="dialog-heading"><i id="ledger-resource-icon"></i><span id="ledger-total"></span><i class="paused-mark" data-icon="pause"></i><button id="close-ledger" class="icon-button" aria-label="关闭资源面板" data-icon="close"></button></div><div id="ledger-content"></div><button id="done-ledger" class="primary wide" aria-label="回到战场" data-icon="play"></button></dialog>
<dialog id="result-dialog" aria-label="对局结算"><div id="result-emblem" class="result-emblem"></div><div id="result-stats" class="result-stats"></div><div class="menu-actions"><button id="again" class="primary" aria-label="再战一局" data-icon="repeat"></button><button id="choose-faction" aria-label="更换阵营" data-icon="crown"></button></div></dialog>
<script type="module" src="game.js"></script></body></html>
